<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Portfólio 2026 — Giovanni</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    .deck {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .deck::-webkit-scrollbar { display: none; }

    .slide {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      overflow: hidden;
    }
    /* Palco fixo 16:9 (1920x1080): todas as imagens são encaixadas neste layout. */
    .frame {
      display: grid;
      place-items: center;
      width: min(100vw, calc(100vh * 16 / 9));
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      overflow: hidden;
      background: #000;
      transform-origin: center center;
      will-change: transform, opacity, filter;
      backface-visibility: hidden;
    }
    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
      opacity: .999;
      transition: opacity .25s ease;
    }
    .frame img.pending { opacity: 0; }
    .frame video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .frame video::-webkit-media-controls-panel { background: rgba(0, 0, 0, .6); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Menu central escuro */
    .index-nav {
      position: fixed;
      top: clamp(16px, 2.4vh, 30px);
      left: 0;
      right: 0;
      width: max-content;
      margin: 0 auto;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      pointer-events: none;
      transition: opacity .35s ease, visibility .35s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .index-nav.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .menu-toggle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 208px;
      height: 40px;
      margin: 0;
      padding: 0 11px;
      border: 0;
      border-radius: 12px;
      background: rgba(17, 17, 17, .95);
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
      transition: background .2s ease, opacity .35s ease;
    }
    .menu-toggle:hover {
      background: rgba(29, 29, 29, .95);
    }
    .index-nav.is-open .menu-toggle,
    .index-nav.is-closing .menu-toggle {
      border-radius: 12px 12px 0 0;
    }
    .index-nav.is-closing .menu-toggle {
      animation: menu-toggle-round .92s ease forwards;
    }
    .index-nav.is-dismissing .menu-toggle {
      opacity: 0;
      pointer-events: none;
      transition: opacity .9s ease;
    }
    .menu-toggle:focus-visible { outline: 1px solid #ff4a17; outline-offset: 4px; }
    .menu-toggle-bars {
      display: grid;
      grid-template-columns: repeat(2, 3px);
      grid-auto-rows: 3px;
      gap: 4px;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .7));
      transition: transform .35s cubic-bezier(.16, .84, .32, 1);
    }
    .menu-toggle-bars span {
      display: block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
      transition: transform .3s ease, opacity .2s ease;
    }
    .index-nav.is-open .menu-toggle-bars { transform: rotate(45deg); }
    .menu-toggle-label {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .05em;
      color: currentColor;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .75);
      white-space: nowrap;
    }
    .menu-toggle-status {
      padding-left: 8px;
      border-left: 1px solid #2a2a2a;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: .02em;
      color: #8f8f8f;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .75);
      white-space: nowrap;
    }
    .index-list {
      display: none;
      flex-direction: column;
      gap: 0;
      width: max-content;
      min-width: 208px;
      padding: 10px;
      border: 0;
      border-radius: 0 0 12px 12px;
      background: rgba(17, 17, 17, .95);
      overflow: hidden;
    }
    .index-nav.is-open .index-list,
    .index-nav.is-closing .index-list {
      display: flex;
      pointer-events: auto;
    }
    .index-nav.is-open .index-list {
      animation: menu-panel-drop .78s cubic-bezier(.16, .84, .32, 1) backwards;
    }
    .index-nav.is-closing .index-list {
      animation: menu-shape-out .92s ease forwards;
    }
    @keyframes menu-panel-drop {
      0% {
        clip-path: inset(0 0 100% 0);
        opacity: .35;
      }
      100% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }
    }
    @keyframes menu-shape-out {
      from { background-color: rgba(17, 17, 17, .95); }
      to { background-color: transparent; }
    }
    @keyframes menu-toggle-round {
      from { border-radius: 12px 12px 0 0; }
      to { border-radius: 12px; }
    }
    @keyframes menu-item-drop {
      0% {
        opacity: 0;
        transform: translateY(-28px);
      }
      65% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes menu-item-return {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-24px) scale(.96);
      }
    }
    .index-nav.is-open .index-item {
      animation: menu-item-drop .68s cubic-bezier(.16, .84, .32, 1) backwards;
      animation-delay: var(--menu-delay, 0s);
    }
    /* Depois da entrada, remove animações e transforms residuais para o texto não desfocar. */
    .index-nav.is-settled .index-list,
    .index-nav.is-settled .index-item { animation: none; }
    .index-nav.is-settled .index-list { clip-path: none; transform: none; }
    .index-nav.is-closing .index-item {
      pointer-events: none;
      animation: menu-item-return .68s cubic-bezier(.16, .84, .32, 1) both;
      animation-delay: var(--menu-close-delay, 0s);
    }
    .index-item {
      position: relative;
      width: 100%;
      pointer-events: auto;
      appearance: none;
      background: none;
      border: 0;
      padding: 9px 16px;
      margin: 0;
      border-radius: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(10px, .68vw, 12px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: .06em;
      text-align: center;
      white-space: nowrap;
      color: #b8b8b8;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
      cursor: pointer;
      transition: color .25s ease, background .25s ease;
    }
    .index-item + .index-item {
      border-top: 1px solid #2a2a2a;
    }
    .index-item:hover,
    .index-item:focus-visible {
      color: #ff4a17;
      background: rgba(29, 29, 29, .95);
      outline: none;
    }
    .index-item.is-active { color: #ff4a17; }
    .index-item.is-active::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff4a17;
      transform: translateY(-50%);
    }
    .index-item small {
      display: block;
      margin-top: 2px;
      font-size: .8em;
      font-weight: 500;
      letter-spacing: .02em;
      color: #737373;
    }
    .index-item.is-active small { color: #ff4a17; }

    /* Contato: WhatsApp e e-mail abrem direto no destino */
    .contact-panel {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid #2a2a2a;
      overflow: hidden;
    }
    .contact-panel[hidden] { display: none; }
    .contact-panel:not([hidden]) {
      animation: contact-panel-in .6s cubic-bezier(.4, 0, .2, 1) backwards;
    }
    @keyframes contact-panel-in {
      0% {
        max-height: 0;
        opacity: 0;
        margin-top: 0;
        padding-top: 0;
        border-top-color: transparent;
      }
      100% {
        max-height: 80px;
        opacity: 1;
        margin-top: 4px;
        padding-top: 6px;
        border-top-color: #2a2a2a;
      }
    }
    .contact-panel:not([hidden]) .contact-link {
      animation: contact-link-in .55s cubic-bezier(.4, 0, .2, 1) backwards;
    }
    @keyframes contact-link-in {
      0% {
        opacity: 0;
        transform: translateY(-6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .contact-panel.is-settled .contact-link { animation: none; }
    .contact-panel:not([hidden]) .contact-link:nth-child(2) { animation-delay: .08s; }
    .index-nav.is-closing .contact-panel:not([hidden]) .contact-link {
      pointer-events: none;
      animation: menu-item-return .55s cubic-bezier(.16, .84, .32, 1) both;
    }
    .index-nav.is-closing .contact-panel:not([hidden]) .contact-link:nth-child(2) {
      animation-delay: .08s;
    }
    .index-nav.is-closing .contact-panel:not([hidden]) {
      border-top-color: transparent;
      transition: border-color .92s ease;
    }
    .contact-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      pointer-events: auto;
      padding: 8px 14px;
      border-radius: 0;
      color: #b8b8b8;
      text-decoration: none;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: .03em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
      transition: color .2s ease, background .2s ease;
    }
    .contact-link:hover,
    .contact-link:focus-visible {
      color: #ff4a17;
      background: rgba(29, 29, 29, .95);
      outline: none;
    }
    .contact-link svg { width: 13px; height: 13px; flex: none; color: #ff4a17; }

    /* Botão voltar ao início (fixo na lateral) */
    .to-start {
      position: fixed;
      right: clamp(16px, 2vw, 38px);
      top: 50%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      appearance: none;
      background: none;
      border: 0;
      padding: 0;
      color: rgba(255, 255, 255, .75);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(10px);
      transition: opacity .4s ease, transform .4s ease, color .25s ease;
    }
    .to-start.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) translateX(0);
    }
    .to-start:hover { color: #fff; }
    .to-start-circle {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(6px);
      transition: border-color .25s ease, background .25s ease;
    }
    .to-start:hover .to-start-circle {
      border-color: #ff4a17;
      background: rgba(0, 0, 0, .68);
    }
    .to-start-circle svg { display: block; width: 18px; height: 18px; }
    .to-start-label {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
    }

    @media (max-height: 560px) {
      .index-list {
        max-height: calc(100dvh - 96px);
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .index-list::-webkit-scrollbar { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .frame img { transition: none; }
      .index-item,
      .menu-toggle-bars,
      .menu-toggle-bars span,
      .to-start { transition: none; }
      .index-nav.is-open .index-list,
      .index-nav.is-open .index-item,
      .index-nav.is-closing .index-item,
      .contact-panel:not([hidden]),
      .contact-panel:not([hidden]) .contact-link,
      .index-nav.is-closing .contact-panel:not([hidden]) .contact-link { animation: none; }
    }
  </style>
</head>
<body>
  <main class="deck" id="deck" aria-label="Apresentação do portfólio"></main>
  <span class="sr-only" id="liveStatus" aria-live="polite"></span>

  <script>
    (() => {
      const deck = document.getElementById("deck");
      const liveStatus = document.getElementById("liveStatus");
      const assetUrl = (filename) => encodeURIComponent(filename).replace(/%2F/g, "/");
      const VERSION = "2026-11-25";
      const imageUrl = (filename) => `${assetUrl(filename)}?v=${VERSION}`;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      // Ordem de exibição:
      // 1..5, 9,10,11,38, 6..8, 36, 12..25, 37, 26..35
      const sequence = [];
      for (let i = 1; i <= 5; i++) sequence.push(i);
      sequence.push(9, 10, 11, 38);
      for (let i = 6; i <= 8; i++) sequence.push(i);
      sequence.push(36);
      for (let i = 12; i <= 25; i++) sequence.push(i);
      sequence.push(37);
      for (let i = 26; i <= 35; i++) sequence.push(i);

      const total = sequence.length;

      // Sessões com o canto esquerdo claro: o menu troca para texto escuro.
      const darkTextSessions = new Set([7, 8, 13, 18, 29, 36]);

      // Sessões 15 e 38 estão em .webp; as demais são .png.
      const customFiles = new Map([[15, "sessão 15.webp"], [38, "sessão 38.webp"]]);

      const videoObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          const video = entry.target.querySelector("video");
          if (!video) return;
          if (entry.isIntersecting && entry.intersectionRatio >= 0.6 && !reducedMotion.matches) {
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        });
      }, { root: deck, threshold: [0.6] });

      sequence.forEach((number, index) => {
        const section = document.createElement("section");
        section.className = "slide";
        section.dataset.index = String(index);
        section.dataset.navTheme = darkTextSessions.has(number) ? "dark-text" : "light-text";
        section.setAttribute("aria-label", `Slide ${index + 1} de ${total}`);

        const frame = document.createElement("div");
        frame.className = "frame";

        if (number === "video05") {
          section.setAttribute("aria-label", `Slide ${index + 1} de ${total}: Show case 05`);
          const video = document.createElement("video");
          video.src = imageUrl("show case 05.mp4");
          video.controls = true;
          video.playsInline = true;
          video.muted = true;
          video.preload = "metadata";
          video.setAttribute("aria-label", "Show case 05");
          frame.append(video);
          section.append(frame);
          deck.append(section);
          videoObserver.observe(section);
          return;
        }

        const img = document.createElement("img");
        img.src = imageUrl(customFiles.get(number) || `sessão ${number}.png`);
        img.alt = `Sessão ${number} do portfólio`;
        img.draggable = false;
        img.decoding = "async";
        if (index > 2) img.loading = "lazy";
        img.classList.add("pending");
        img.addEventListener("load", () => img.classList.remove("pending"), { once: true });
        if (img.complete) img.classList.remove("pending");

        frame.append(img);
        section.append(frame);
        deck.append(section);
      });

      const sections = Array.from(deck.querySelectorAll(".slide"));
      let activeIndex = 0;

      // Menu lateral: cada nome leva ao slide onde aquela seção começa.
      const menu = [
        { label: "Sobre mim", index: 1 },
        { label: "Experiências", index: 2 },
        { label: "Soluções de design", index: 35 },
        { label: "Contato", index: 37, contact: true }
      ];

      const nav = document.createElement("nav");
      nav.className = "index-nav";
      nav.setAttribute("aria-label", "Menu do portfólio");

      const menuToggle = document.createElement("button");
      menuToggle.type = "button";
      menuToggle.className = "menu-toggle";
      menuToggle.setAttribute("aria-label", "Abrir menu");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-controls", "indexList");
      menuToggle.innerHTML = `
        <span class="menu-toggle-bars" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span class="menu-toggle-label" aria-hidden="true">Menu</span>
        <span class="menu-toggle-status" aria-hidden="true">Disponível para contratação</span>
      `;

      const navList = document.createElement("div");
      navList.className = "index-list";
      navList.id = "indexList";
      const navItems = [];

      let menuCloseTimer = null;
      let menuSettleTimer = null;
      let hoverOpenTimer = null;
      let hoverCloseTimer = null;
      let hoverOpened = false;
      const canHover = window.matchMedia("(hover: hover) and (pointer: fine)");

      function resetContactPanel() {
        const panel = navList.querySelector(".contact-panel");
        const contactButton = navList.querySelector('[aria-controls="contactPanel"]');
        if (panel) panel.hidden = true;
        if (contactButton) contactButton.setAttribute("aria-expanded", "false");
      }

      function setMenuOpen(open) {
        clearTimeout(menuCloseTimer);
        clearTimeout(menuSettleTimer);
        nav.classList.remove("is-settled");
        if (!open) {
          hoverOpened = false;
          if (hoverCloseTimer) {
            window.clearTimeout(hoverCloseTimer);
            hoverCloseTimer = null;
          }
        }
        if (open) {
          nav.classList.remove("is-closing");
          nav.classList.add("is-open");
          menuToggle.setAttribute("aria-expanded", "true");
          menuToggle.setAttribute("aria-label", "Fechar menu");
          resetContactPanel();
          menuSettleTimer = setTimeout(() => {
            if (nav.classList.contains("is-open")) nav.classList.add("is-settled");
          }, (navItems.length - 1) * 80 + 760);
          return;
        }
        if (!nav.classList.contains("is-open")) return;
        nav.classList.remove("is-open");
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Abrir menu");
        if (reducedMotion.matches) {
          resetContactPanel();
          return;
        }
        nav.classList.add("is-closing");
        menuCloseTimer = setTimeout(() => {
          nav.classList.remove("is-closing");
          resetContactPanel();
        }, (navItems.length - 1) * 80 + 700);
      }

      function finishMenuClose() {
        if (menuCloseTimer) {
          window.clearTimeout(menuCloseTimer);
          menuCloseTimer = null;
        }
        nav.classList.remove("is-closing");
        resetContactPanel();
      }

      function cancelHoverOpen() {
        if (!hoverOpenTimer) return;
        window.clearTimeout(hoverOpenTimer);
        hoverOpenTimer = null;
      }

      function cancelHoverClose() {
        if (!hoverCloseTimer) return;
        window.clearTimeout(hoverCloseTimer);
        hoverCloseTimer = null;
      }

      function scheduleHoverClose() {
        if (!hoverOpened || !nav.classList.contains("is-open") || hoverCloseTimer) return;
        hoverCloseTimer = window.setTimeout(() => {
          hoverCloseTimer = null;
          if (hoverOpened && nav.classList.contains("is-open")) setMenuOpen(false);
        }, 260);
      }

      menuToggle.addEventListener("click", () => {
        cancelHoverOpen();
        cancelHoverClose();
        hoverOpened = false;
        setMenuOpen(!nav.classList.contains("is-open"));
      });

      menuToggle.addEventListener("mouseenter", () => {
        cancelHoverClose();
        if (!canHover.matches || nav.classList.contains("is-open") ||
            nav.classList.contains("is-hidden")) return;
        cancelHoverOpen();
        hoverOpenTimer = window.setTimeout(() => {
          hoverOpenTimer = null;
          if (!canHover.matches || nav.classList.contains("is-open") ||
              nav.classList.contains("is-hidden")) return;
          hoverOpened = true;
          setMenuOpen(true);
        }, 120);
      });

      menuToggle.addEventListener("mouseleave", () => {
        cancelHoverOpen();
        scheduleHoverClose();
      });

      nav.addEventListener("mouseenter", cancelHoverClose);
      nav.addEventListener("mouseleave", scheduleHoverClose);
      navList.addEventListener("mouseenter", cancelHoverClose);
      navList.addEventListener("mouseleave", scheduleHoverClose);

      menu.forEach((entry) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "index-item";
        button.style.setProperty("--menu-delay", `${navItems.length * 0.08}s`);
        button.style.setProperty("--menu-close-delay", `${(menu.length - 1 - navItems.length) * 0.08}s`);
        button.append(document.createTextNode(entry.label));
        if (entry.note) {
          const note = document.createElement("small");
          note.textContent = entry.note;
          button.append(note);
        }

        if (entry.contact) {
          const contactMessage = "Olá, Giovani! Vim pelo seu portfólio e gostaria de conversar sobre um projeto.";
          const whatsappUrl = `https://wa.me/5531986053039?text=${encodeURIComponent(contactMessage)}`;
          const emailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent("giovanimaierdesigner@hotmail.com")}&su=${encodeURIComponent("Contato pelo portfólio")}&body=${encodeURIComponent(contactMessage)}`;
          const panel = document.createElement("div");
          panel.className = "contact-panel";
          panel.id = "contactPanel";
          panel.hidden = true;
          panel.innerHTML = `
            <a class="contact-link" href="${whatsappUrl}" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.4 15.15L2 22l4.98-1.6A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.1 8.1 0 0 1-4.13-1.14l-.3-.18-2.95.95.96-2.87-.2-.31A8.1 8.1 0 1 1 12.04 20.1Zm4.45-6.07c-.24-.12-1.44-.71-1.66-.79-.22-.08-.38-.12-.54.12-.16.24-.62.79-.76.95-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.1-.49.1-.1.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.4h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2 0 1.18.86 2.32.98 2.48.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.1.16 1.52.1.46-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28Z"/></svg>
              <span>WhatsApp</span>
            </a>
            <a class="contact-link" href="${emailUrl}" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <span>E-mail</span>
            </a>
          `;
          button.setAttribute("aria-expanded", "false");
          button.setAttribute("aria-controls", "contactPanel");
          button.setAttribute("aria-haspopup", "true");
          let contactSettleTimer = null;
          function openContactPanel() {
            if (!panel.hidden) return;
            panel.hidden = false;
            button.setAttribute("aria-expanded", "true");
            clearTimeout(contactSettleTimer);
            panel.classList.remove("is-settled");
            contactSettleTimer = setTimeout(() => {
              if (!panel.hidden) panel.classList.add("is-settled");
            }, 700);
          }
          function closeContactPanel() {
            if (panel.hidden) return;
            panel.hidden = true;
            button.setAttribute("aria-expanded", "false");
            clearTimeout(contactSettleTimer);
            panel.classList.remove("is-settled");
          }
          button.addEventListener("mouseenter", openContactPanel);
          button.addEventListener("click", () => {
            if (panel.hidden) openContactPanel();
            else closeContactPanel();
          });
          navList.append(button, panel);
        } else {
          button.addEventListener("click", () => {
            setMenuOpen(false);
            goTo(entry.index);
          });
          navList.append(button);
        }
        navItems.push(button);
      });

      nav.append(menuToggle, navList);

      const toStart = document.createElement("button");
      toStart.type = "button";
      toStart.className = "to-start";
      toStart.setAttribute("aria-label", "Voltar ao início");
      toStart.innerHTML = `
        <span class="to-start-circle" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
        </span>
        <span class="to-start-label">Início</span>
      `;
      toStart.addEventListener("click", () => {
        deck.scrollTo({ top: 0, behavior: "auto" });
      });

      document.body.append(nav, toStart);

      // Transição de profundidade: o slide seguinte nasce pequeno, recuado e suave,
      // e cresce até o tamanho real conforme entra; o que sai recua e desvanece.
      let effectRaf = null;

      function applyScrollEffect() {
        effectRaf = null;
        const height = deck.clientHeight || 1;
        const position = deck.scrollTop / height;

        sections.forEach((section, index) => {
          const frame = section.firstElementChild;
          if (!frame) return;

          if (reducedMotion.matches) {
            frame.style.transform = "";
            frame.style.opacity = "";
            frame.style.filter = "";
            const media = frame.firstElementChild;
            if (media && media.tagName === "IMG") media.style.transform = "";
            return;
          }

          const delta = index - position;
          const pose = Math.max(-1, Math.min(1, delta));
          const distance = Math.abs(pose);

          frame.style.opacity = distance >= 1 ? "0.12" : Math.max(0, 1 - distance * 0.86).toFixed(3);
          frame.style.filter = distance > 0.02 && distance < 1
            ? `blur(${(distance * 2.4).toFixed(2)}px) brightness(${(1 - distance * 0.16).toFixed(3)})`
            : "none";

          if (distance < 0.001) {
            frame.style.transform = "none";
          } else {
            const scale = 1 - distance * 0.32;
            frame.style.transform = [
              "perspective(1400px)",
              `translateZ(${(-distance * 220).toFixed(1)}px)`,
              `rotateX(${(pose * 2.4).toFixed(2)}deg)`,
              `scale(${scale.toFixed(4)})`
            ].join(" ");
          }
        });
      }

      function requestScrollEffect() {
        if (effectRaf !== null) return;
        effectRaf = window.requestAnimationFrame(applyScrollEffect);
      }

      deck.addEventListener("scroll", requestScrollEffect, { passive: true });
      window.addEventListener("resize", requestScrollEffect);
      reducedMotion.addEventListener?.("change", requestScrollEffect);

      function currentIndex() {
        return Math.max(0, Math.min(total - 1, Math.round(deck.scrollTop / deck.clientHeight)));
      }

      function syncStatus() {
        const index = currentIndex();
        if (index !== activeIndex) {
          activeIndex = index;
          liveStatus.textContent = `Slide ${index + 1} de ${total}`;
        }

        let currentSection = -1;
        menu.forEach((entry, i) => {
          if (index >= entry.index) currentSection = i;
        });
        navItems.forEach((item, i) => {
          const isActive = i === currentSection;
          item.classList.toggle("is-active", isActive);
          if (isActive) item.setAttribute("aria-current", "location");
          else item.removeAttribute("aria-current");
        });
        nav.classList.toggle("is-on-light", sections[index]?.dataset.navTheme === "dark-text");
        toStart.classList.toggle("is-visible", index >= 1);
      }

      let scrollTimer = null;
      let menuHideTimer = null;
      let directionAnchor = deck.scrollTop;
      let scrollDirection = "down";

      function showMenuForScroll() {
        if (menuHideTimer) {
          window.clearTimeout(menuHideTimer);
          menuHideTimer = null;
        }
        if (nav.classList.contains("is-closing")) finishMenuClose();
        nav.classList.remove("is-hidden", "is-dismissing");
      }

      function hideMenuForScroll() {
        const wasOpen = nav.classList.contains("is-open");
        if (wasOpen) {
          nav.classList.add("is-dismissing");
          setMenuOpen(false);
        } else if (nav.classList.contains("is-closing")) {
          nav.classList.add("is-dismissing");
        }

        if (reducedMotion.matches) {
          nav.classList.remove("is-dismissing");
          nav.classList.add("is-hidden");
          return;
        }

        if (menuHideTimer) return;

        if (nav.classList.contains("is-closing")) {
          menuHideTimer = window.setTimeout(() => {
            menuHideTimer = null;
            if (scrollDirection === "down" && currentIndex() > 0) {
              nav.classList.remove("is-dismissing");
              nav.classList.add("is-hidden");
            }
          }, (navItems.length - 1) * 80 + 760);
          return;
        }

        nav.classList.add("is-hidden");
      }

      deck.addEventListener("scroll", () => {
        const top = deck.scrollTop;
        const delta = top - directionAnchor;
        if (Math.abs(delta) > 8) {
          scrollDirection = delta > 0 ? "down" : "up";
          directionAnchor = top;
        }

        const showMenu = currentIndex() === 0 || scrollDirection === "up";
        if (showMenu) showMenuForScroll();
        else hideMenuForScroll();

        if (scrollTimer) window.clearTimeout(scrollTimer);
        scrollTimer = window.setTimeout(syncStatus, 80);
      }, { passive: true });

      function goTo(index) {
        const target = Math.max(0, Math.min(total - 1, index));
        sections[target].scrollIntoView({
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
          block: "center"
        });
      }

      document.addEventListener("keydown", (event) => {
        if (event.target instanceof HTMLVideoElement && /^( |ArrowRight|ArrowLeft)$/.test(event.key)) return;
        if (event.target.closest(".index-nav") && event.key === " ") return;
        if (event.key === "Escape" && nav.classList.contains("is-open")) {
          setMenuOpen(false);
          return;
        }
        if (event.key === "ArrowDown" || event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          goTo(currentIndex() + 1);
        } else if (event.key === "ArrowUp" || event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          goTo(currentIndex() - 1);
        } else if (event.key === "Home") {
          event.preventDefault();
          goTo(0);
        } else if (event.key === "End") {
          event.preventDefault();
          goTo(total - 1);
        } else if (event.key.toLowerCase() === "f") {
          if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
          else document.exitFullscreen?.();
        }
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".index-nav") && nav.classList.contains("is-open")) {
          setMenuOpen(false);
          return;
        }
        if (event.target.closest("video")) return;
        if (event.target.closest(".index-nav, .to-start")) return;
        goTo(currentIndex() + (event.clientX < window.innerWidth / 2 ? -1 : 1));
      });

      syncStatus();
      nav.classList.toggle("is-hidden", currentIndex() > 0);
      requestScrollEffect();
    })();
  </script>
</body>
</html>
